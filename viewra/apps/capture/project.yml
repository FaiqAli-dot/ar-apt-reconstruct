name: ViewraCapture
options:
  bundleIdPrefix: com.viewra
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  BASE_SDK: iphoneos
  TARGETED_DEVICE_FAMILY: "1,2"
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  CaptureCore:
    path: ../../packages/CaptureCore
targets:
  ViewraCapture:
    type: application
    platform: iOS
    sources:
      - path: ViewraCapture
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.viewra.capture
      PRODUCT_NAME: ViewraCapture
      INFOPLIST_FILE: ViewraCapture/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: CaptureCore
        product: CaptureCore
    info:
      path: ViewraCapture/Info.plist
      properties:
        CFBundleDisplayName: Viewra Capture
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Viewra Capture needs camera access to photograph walkthrough nodes (LEFT, CENTER, RIGHT).
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
